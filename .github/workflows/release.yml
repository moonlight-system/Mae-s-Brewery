name: Release

# Runs when you push a tag such as v0.2.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to create the release and upload the APK

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Only arm64 (nearly every phone). Add the other targets here and drop
      # `--target aarch64` below if you also want a universal APK (slower build).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # The runner already has the Android SDK and NDK; Tauri just needs to know where the NDK is
      - name: Point Tauri to the NDK
        run: echo "NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      # The tag is the source of truth: v0.2.0 -> version 0.2.0 inside the app
      # (this is the version the in-app update check compares against, and Android's versionCode)
      - name: Set the app version from the tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp src-tauri/tauri.conf.json

      - run: npm ci

      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > src-tauri/gen/android/app/release.jks
          {
            echo "password=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "storeFile=release.jks"
          } > src-tauri/gen/android/keystore.properties

      - name: Build the APK
        run: npx tauri android build --apk --target aarch64

      - name: Name the APK after the version
        run: |
          APK=$(find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' | head -n 1)
          echo "Found: $APK"
          cp "$APK" "Maes-Brewery-${GITHUB_REF_NAME}.apk"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: Maes-Brewery-${{ github.ref_name }}.apk
          generate_release_notes: true
          # a tag like v0.3.0-beta is published as a pre-release, which the in-app check ignores
          prerelease: ${{ contains(github.ref_name, '-') }}
